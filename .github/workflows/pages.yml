# Publish the lab's pages (index.html, practice.html, python-cheatsheet.html,
# assets/, and every sections/**/*.html) to GitHub Pages on each push to main.
# Python exercises, notes, story bank, mock log, .claude/, tools and templates
# are left out on purpose.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate curriculum.js
        run: python3 tools/build.py
      - name: Collect the pages
        run: |
          mkdir -p _site
          cp index.html practice.html python-cheatsheet.html _site/
          cp -r assets _site/
          find sections -name '*.html' -exec cp --parents {} _site/ \;
          touch _site/.nojekyll
          echo "Published files:" && find _site -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
